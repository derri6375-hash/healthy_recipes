<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="menu">
        <a href="index.html" class="button">Главная</a>
        <a href="catalog.html" class="button">Каталог рецептов</a>
        <a href="gallery.html" class="button">Галерея блюд</a>
        <a href="contacts.html" class="button">Контакты</a>
    </div>

    <div class="container">
        <h1>Свяжитесь с нами</h1>
        <p>Задайте вопрос, предложите свой рецепт или просто поздоровайтесь :)</p>

        <form id="contactForm" class="contact-form">
            <label for="name">Ваше имя:</label>
            <input type="text" id="name" name="name" placeholder="Name:" required>

            <label for="email">Ваш Email:</label>
            <input type="email" id="email" name="email" placeholder="healthy_recipes@mail.ru" required>

            <label for="message">Сообщение:</label>
            <textarea id="message" rows="4" placeholder="Напишите, какой рецепт вам интересен..."></textarea>

            <button type="button" class="action-btn" onclick="submitForm()">Отправить</button>
        </form>

        <div class="contacts-info">
            <h3>Другие способы связаться:</h3>
            <ul>
                <li>Почта: healthy@recipes.ru</li>
                <li>Telegram: @healthy_recipes</li>
            </ul>
        </div>
    </div>

    <script>
        function submitForm() {
            let name = document.getElementById('name').value;
            let email = document.getElementById('email').value;
            if (name && email) {
                alert(`Спасибо, ${name}! Мы ответим вам на ${email} в ближайшее время.`);
                document.getElementById('contactForm').reset();
            } else {
                alert('Пожалуйста, заполните имя и email.');
            }
        }
    </script>
</body>

</html>
